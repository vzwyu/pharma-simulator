<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>药企模拟器 · Pharma Simulator</title>
<style>
/* =========================================================
   上量 · 内资药企营销模拟  —  style.css
   ========================================================= */

:root {
  --bg: #F4F6F9;
  --panel: #FFFFFF;
  --ink: #0F1A26;
  --ink2: #4A5C70;
  --ink3: #8494A6;
  --line: #E3E9F0;
  --line2: #F0F4F8;
  --blue: #0143B0;
  --blue2: #2F6BC9;
  --blue-lt: #E9EFFA;
  --up: #C0392B;
  --down: #17795A;
  --warn: #B8730A;
  --danger: #B3261E;
  --gold: #B8860B;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: "Microsoft YaHei", "微软雅黑", -apple-system, "Segoe UI", system-ui, sans-serif;
  font-size: 13.5px;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; }
select { font-family: inherit; }
::selection { background: #C9DAF5; }

/* ---------------- 顶栏 ---------------- */
.topbar {
  height: 62px; background: #fff; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 20px; padding: 0 20px;
  position: sticky; top: 0; z-index: 40;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 196px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 9px; background: var(--blue);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 700; letter-spacing: -1px;
  box-shadow: 0 2px 8px rgba(1,67,176,.28);
}
.brand-t { line-height: 1.25; }
.brand-t b { font-size: 15.5px; letter-spacing: .5px; }
.brand-t span { display: block; font-size: 10px; color: var(--ink3); letter-spacing: .8px; }

.who { display: flex; flex-direction: column; line-height: 1.35; padding-right: 8px; border-right: 1px solid var(--line); }
.who b { font-size: 13.5px; }
.who span { font-size: 11px; color: var(--ink3); }

.kpis { display: flex; gap: 4px; flex: 1; overflow: hidden; }
.kpi { padding: 4px 12px; border-radius: 8px; min-width: 92px; }
.kpi:hover { background: var(--line2); }
.kpi label { display: block; font-size: 10.5px; color: var(--ink3); letter-spacing: .3px; }
.kpi strong { font-size: 16px; font-variant-numeric: tabular-nums; letter-spacing: -.2px; }
.kpi strong small { font-size: 10px; font-weight: 400; color: var(--ink3); margin-left: 2px; }
.kpi .d { font-size: 10.5px; margin-left: 4px; font-variant-numeric: tabular-nums; }
.d.up { color: var(--up); }
.d.down { color: var(--down); }

.btn {
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  padding: 8px 14px; border-radius: 8px; font-size: 13px; transition: .15s;
}
.btn:hover { border-color: #C6D2E0; background: #FAFCFF; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary {
  background: var(--blue); border-color: var(--blue); color: #fff;
  font-weight: 600; box-shadow: 0 2px 10px rgba(1,67,176,.25);
}
.btn.primary:hover { background: #013a99; }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--blue); }
.btn.ghost:hover { background: var(--blue-lt); }
.btn.danger { color: var(--danger); border-color: #E8CFCC; }
.btn.danger:hover { background: #FBF0EF; }
.btn.block { width: 100%; }

.turn-btn { padding: 9px 20px; font-size: 13.5px; white-space: nowrap; }
.turn-btn .ap { font-size: 11px; opacity: .8; margin-left: 8px; }

/* ---------------- 布局 ---------------- */
.layout { display: flex; align-items: flex-start; }
.sidenav {
  width: 150px; flex: 0 0 150px; padding: 14px 10px; position: sticky; top: 62px;
  height: calc(100vh - 62px); background: #fff; border-right: 1px solid var(--line);
}
.navitem {
  display: flex; align-items: center; gap: 9px; padding: 9px 11px; border-radius: 8px;
  font-size: 13px; color: var(--ink2); cursor: pointer; margin-bottom: 2px;
  border: 1px solid transparent;
}
.navitem:hover { background: var(--line2); }
.navitem.on { background: var(--blue-lt); color: var(--blue); font-weight: 600; }
.navitem i { font-style: normal; font-size: 14px; width: 16px; text-align: center; opacity: .85; }
.navitem .badge {
  margin-left: auto; background: var(--danger); color: #fff; font-size: 10px;
  padding: 1px 5px; border-radius: 8px; font-weight: 600;
}
.navfoot { margin-top: 18px; padding: 10px 11px; font-size: 10.5px; color: var(--ink3); line-height: 1.7; border-top: 1px solid var(--line2); }

.main { flex: 1; min-width: 0; padding: 18px 22px 60px; max-width: 1240px; }

.pagehead { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; gap: 16px; }
.pagehead h2 { margin: 0; font-size: 17px; letter-spacing: .2px; }
.pagehead h2 span { font-size: 11px; color: var(--ink3); font-weight: 400; margin-left: 8px; letter-spacing: .5px; }
.pagehead p { margin: 4px 0 0; font-size: 12px; color: var(--ink2); }

/* ---------------- 卡片 ---------------- */
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px; box-shadow: 0 1px 2px rgba(16,26,38,.04);
}
.card-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-h h3 { margin: 0; font-size: 13.5px; font-weight: 600; letter-spacing: .2px; }
.card-h h3 em { font-style: normal; font-size: 10px; color: var(--ink3); font-weight: 400; margin-left: 6px; letter-spacing: .5px; }
.card-h .sub { font-size: 11.5px; color: var(--ink3); }

.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-32 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; }
.mt12 { margin-top: 12px; }
.mt16 { margin-top: 16px; }

/* KPI 大卡 */
.stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; position: relative; overflow: hidden; }
.stat label { display: block; font-size: 11px; color: var(--ink3); margin-bottom: 5px; }
.stat label em { font-style: normal; font-size: 9.5px; letter-spacing: .4px; opacity: .8; margin-left: 4px; }
.stat .v { font-size: 25px; font-weight: 700; letter-spacing: -.8px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .v small { font-size: 11px; font-weight: 400; color: var(--ink3); margin-left: 3px; letter-spacing: 0; }
.stat .foot { margin-top: 6px; font-size: 11px; color: var(--ink3); display: flex; align-items: center; gap: 6px; }
.stat .spark { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 22px; display: block; }
.stat.blue { border-top: 2px solid var(--blue); }
.stat.warn { border-top: 2px solid var(--warn); }
.stat.danger { border-top: 2px solid var(--danger); }

.chip { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; padding: 1px 6px; border-radius: 5px; font-variant-numeric: tabular-nums; }
.chip.up { background: #FBECEA; color: var(--up); }
.chip.down { background: #E9F5F0; color: var(--down); }
.chip.flat { background: var(--line2); color: var(--ink3); }

/* ---------------- 进度 / 条形 ---------------- */
.bar { height: 6px; background: var(--line2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--blue); transition: width .5s ease; }
.bar.thin { height: 4px; }
.bar > i.g { background: var(--down); }
.bar > i.w { background: var(--warn); }
.bar > i.r { background: var(--danger); }

.proline { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line2); font-size: 12px; }
.proline:last-child { border-bottom: 0; }
.proline .n { width: 82px; color: var(--ink2); flex: 0 0 82px; }
.proline .b { flex: 1; }
.proline .v { width: 96px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink2); flex: 0 0 96px; }
.proline .k { width: 14px; text-align: center; flex: 0 0 14px; }
.ok { color: var(--down); font-weight: 700; }
.no { color: var(--ink3); }

/* ---------------- 终端 ---------------- */
.term-layout { display: grid; grid-template-columns: 320px 1fr; gap: 12px; align-items: start; }
.term-list { display: flex; flex-direction: column; gap: 7px; max-height: calc(100vh - 200px); overflow: auto; padding-right: 2px; }
.term-item {
  border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 11px 12px; cursor: pointer; transition: .15s;
}
.term-item:hover { border-color: #C6D5E8; }
.term-item.on { border-color: var(--blue); background: #FBFDFF; box-shadow: 0 0 0 2px rgba(1,67,176,.07); }
.term-item .t1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.term-item .t1 b { font-size: 13px; font-weight: 600; }
.term-item .t1 span { font-size: 10.5px; color: var(--ink3); }
.term-item .t2 { display: flex; justify-content: space-between; margin: 7px 0 4px; font-size: 11px; color: var(--ink3); }
.term-item .t2 b { color: var(--ink); font-size: 12.5px; font-variant-numeric: tabular-nums; }

.detail-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12px; }
.detail-row .lb { width: 62px; color: var(--ink3); flex: 0 0 62px; }
.detail-row .bar { flex: 1; }
.detail-row .vl { width: 52px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink2); flex: 0 0 52px; }

/* 表格 */
table.tb { width: 100%; border-collapse: collapse; font-size: 12px; }
table.tb th {
  text-align: left; font-weight: 500; color: var(--ink3); font-size: 10.5px; letter-spacing: .3px;
  padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.tb td { padding: 8px; border-bottom: 1px solid var(--line2); font-variant-numeric: tabular-nums; }
table.tb tr:last-child td { border-bottom: 0; }
table.tb td.r, table.tb th.r { text-align: right; }
table.tb tr:hover td { background: #FBFCFE; }
.mono { font-variant-numeric: tabular-nums; }

/* ---------------- 团队 ---------------- */
.team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.rep {
  border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; background: #fff; position: relative;
}
.rep:hover { border-color: #C6D5E8; }
.rep .rh { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 34px; height: 34px; border-radius: 9px; background: var(--blue-lt); color: var(--blue);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex: 0 0 34px;
}
.rep .rh b { font-size: 13.5px; }
.rep .rh .meta { font-size: 10.5px; color: var(--ink3); }
.tag { display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 4px; background: var(--line2); color: var(--ink2); margin-left: 5px; }
.tag.risk { background: #FBECEA; color: var(--danger); }
.tag.good { background: #E9F5F0; color: var(--down); }

.rep .metrics { display: flex; gap: 14px; margin: 10px 0 8px; }
.rep .metrics div { flex: 1; }
.rep .metrics label { display: block; font-size: 10px; color: var(--ink3); }
.rep .metrics b { font-size: 14px; font-variant-numeric: tabular-nums; }

.rep .row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
.rep select {
  flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; font-size: 11.5px;
  background: #fff; color: var(--ink); max-width: 100%;
}
.pills { display: flex; gap: 3px; flex-wrap: wrap; }
.pill {
  border: 1px solid var(--line); background: #fff; border-radius: 5px; padding: 4px 7px; font-size: 10.5px; color: var(--ink2);
}
.pill:hover { border-color: #C6D5E8; }
.pill.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.pill.on.risk { background: var(--danger); border-color: var(--danger); }
.pill.on.warn { background: var(--warn); border-color: var(--warn); }

/* ---------------- 项目 ---------------- */
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 12px; }
.proj { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: #fff; display: flex; flex-direction: column; }
.proj h4 { margin: 0 0 2px; font-size: 13.5px; }
.proj h4 em { font-style: normal; font-size: 9.5px; color: var(--ink3); font-weight: 400; margin-left: 5px; letter-spacing: .4px; }
.proj p { margin: 6px 0 10px; font-size: 11.5px; color: var(--ink2); line-height: 1.65; flex: 1; }
.proj .pp { display: flex; gap: 8px; font-size: 11px; color: var(--ink3); margin-bottom: 10px; }
.proj .pp b { color: var(--ink); font-variant-numeric: tabular-nums; }
.proj select { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 6px; font-size: 11.5px; margin-bottom: 8px; }

/* ---------------- 合规 ---------------- */
.gauge-wrap { padding: 8px 0 4px; }
.gauge-track { position: relative; height: 14px; border-radius: 99px; background: #EDF1F6; overflow: hidden; }
.gauge-fill { height: 100%; border-radius: 99px; transition: width .5s ease; }
.gauge-tick { position: absolute; top: 0; width: 1px; height: 100%; background: #fff; opacity: .9; }

.gauge-scale { position: relative; height: 14px; margin-top: 6px; font-size: 10px; color: var(--ink3); }
.gauge-scale span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.gauge-scale span:first-child { transform: none; }

.riskrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line2); font-size: 12px; }
.riskrow:last-child { border-bottom: 0; }
.riskrow .nm { width: 110px; flex: 0 0 110px; }
.riskrow .bar { flex: 1; }
.riskrow .vv { width: 46px; text-align: right; flex: 0 0 46px; font-variant-numeric: tabular-nums; }

/* ---------------- 日志 ---------------- */
.loglist { display: flex; flex-direction: column; }
.logi { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line2); font-size: 12px; line-height: 1.65; }
.logi .t { width: 52px; flex: 0 0 52px; color: var(--ink3); font-size: 10.5px; padding-top: 2px; font-variant-numeric: tabular-nums; }
.logi .x { flex: 1; color: var(--ink2); }
.logi.good .x { color: #14684C; }
.logi.bad .x { color: #9E2A21; }
.logi.sales .x { color: var(--ink); font-weight: 600; }
.logi.sys .x { color: var(--blue); }

/* ---------------- 模态 ---------------- */
#modal-root { position: fixed; inset: 0; pointer-events: none; z-index: 100; }
.mask {
  position: absolute; inset: 0; background: rgba(11,20,31,.42); backdrop-filter: blur(2px);
  pointer-events: auto; display: flex; align-items: center; justify-content: center; padding: 24px;
  animation: fadein .18s ease;
}
@keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
.modal {
  background: #fff; border-radius: 14px; width: 100%; max-width: 560px; max-height: 88vh; overflow: auto;
  box-shadow: 0 24px 70px rgba(9,18,30,.28); animation: pop .2s cubic-bezier(.2,.8,.3,1);
}
@keyframes pop { from { transform: translateY(10px) scale(.985); opacity: 0 } to { transform: none; opacity: 1 } }
.modal.wide { max-width: 760px; }
.modal-h { padding: 18px 22px 0; }
.modal-h h3 { margin: 0; font-size: 16px; }
.modal-h .en { font-size: 10px; color: var(--ink3); letter-spacing: .8px; margin-top: 3px; }
.modal-b { padding: 14px 22px 4px; font-size: 13px; line-height: 1.8; color: var(--ink2); }
.modal-b p { margin: 0 0 10px; }
.modal-f { padding: 12px 22px 18px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.modal-f .btn { min-width: 96px; }

.opt {
  display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff;
  border-radius: 9px; padding: 11px 13px; margin-bottom: 8px; transition: .15s;
}
.opt:hover { border-color: var(--blue); background: #FBFCFF; }
.opt b { display: block; font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.opt span { font-size: 11px; color: var(--ink3); }

.rep-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--line2); font-size: 12.5px; }
.rep-row:last-child { border-bottom: 0; }
.rep-row b { font-variant-numeric: tabular-nums; }
.rep-row .up { color: var(--up); }
.rep-row .down { color: var(--down); }

/* 开始页 */
.start {
  position: fixed; inset: 0; z-index: 200; background: linear-gradient(135deg, #0A1B33 0%, #0B2B5C 45%, #0143B0 100%);
  display: flex; align-items: center; justify-content: center; padding: 30px; overflow: auto;
}
.start-inner { max-width: 780px; width: 100%; color: #fff; }
.start .kicker { font-size: 11px; letter-spacing: 3px; color: #8FB4E8; margin-bottom: 10px; }
.start h1 { font-size: 54px; margin: 0; letter-spacing: 6px; font-weight: 800; }
.start h1 small { font-size: 13px; letter-spacing: 4px; font-weight: 400; color: #9CC0EC; margin-left: 14px; vertical-align: middle; }
.start .lead { font-size: 14px; line-height: 1.95; color: #C8DAF1; margin: 18px 0 22px; max-width: 620px; }
.start .rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
.start .rule { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 13px 14px; }
.start .rule b { display: block; font-size: 12.5px; margin-bottom: 5px; }
.start .rule span { font-size: 11px; color: #A9C3E2; line-height: 1.65; }
.start .namebox { display: flex; gap: 10px; align-items: center; }
.start input {
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.24); color: #fff;
  border-radius: 8px; padding: 11px 14px; font-size: 14px; width: 200px; font-family: inherit;
}
.start input::placeholder { color: #7F9BC0; }
.start .btn-start {
  background: #fff; color: var(--blue); border: 0; padding: 12px 30px; border-radius: 8px;
  font-size: 14px; font-weight: 700; letter-spacing: 1px;
}
.start .btn-start:hover { background: #EAF1FB; }
.start .fine { font-size: 10.5px; color: #7C97B9; margin-top: 14px; line-height: 1.7; }

/* toast */
#toast-root { position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  background: #16202B; color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 12.5px;
  box-shadow: 0 8px 26px rgba(0,0,0,.22); animation: tin .2s ease;
}
.toast.bad { background: #8E231B; }
.toast.good { background: #125B44; }
@keyframes tin { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

/* misc */
.hint { font-size: 11px; color: var(--ink3); line-height: 1.7; }
.hint b { color: var(--ink2); }
.empty { text-align: center; padding: 34px 10px; color: var(--ink3); font-size: 12px; }
.flex { display: flex; }
.between { justify-content: space-between; }
.center { align-items: center; }
.gap8 { gap: 8px; }
.gap12 { gap: 12px; }
.w100 { width: 100%; }

@media (max-width: 1180px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .term-layout { grid-template-columns: 1fr; }
  .kpis .kpi:nth-child(n+4) { display: none; }
}

/* =========================================================
   v2 组件：多选、矩阵、医共体、行动选择
   ========================================================= */
.modal.wide { max-width: 840px; }

/* 代表卡片：管理当量 */
.loadrow { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--ink3); margin-top: 10px; }
.loadrow .bar { flex: 1; }
.loadrow b { font-variant-numeric: tabular-nums; font-size: 11px; }

/* 多选下拉 */
.msel { position: relative; margin-top: 8px; }
.msel-btn {
  width: 100%; display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: #fff; border-radius: 7px;
  padding: 6px 9px; font-size: 11.5px; color: var(--ink2); text-align: left;
}
.msel-btn:hover { border-color: #C6D5E8; }
.msel-btn b { color: var(--ink); font-size: 12px; }
.msel-btn i { margin-left: auto; font-style: normal; color: var(--ink3); }
.msel-pop {
  position: absolute; z-index: 60; top: calc(100% + 4px); left: 0; right: 0;
  background: #fff; border: 1px solid var(--line); border-radius: 9px;
  box-shadow: 0 14px 34px rgba(16,26,38,.16); padding: 5px; max-height: 268px; overflow: auto;
}
.msel-item {
  display: flex; align-items: center; gap: 7px; padding: 5px 6px;
  border-radius: 6px; font-size: 11.5px; cursor: pointer;
}
.msel-item:hover { background: var(--line2); }
.msel-item input { margin: 0; }
.msel-item span { flex: 1; }
.msel-item em { font-style: normal; font-size: 9.5px; color: var(--ink3); }
.msel-foot {
  padding: 7px 6px 4px; font-size: 11px; color: var(--blue);
  cursor: pointer; border-top: 1px solid var(--line2); margin-top: 4px;
}

/* 终端 chip */

function pickOne(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function genPlace(suffix) {
  let n, g = 0;
  do { n = pickOne(CH_A) + pickOne(CH_B); g++; } while (g < 3 && WORLD._used[n]);
  WORLD._used[n] = 1;
  return n + suffix;
}

  const usedTa = {};
  PROD_ARCH.forEach((a, i) => {
    const cands = a.ta.filter(x => !usedTa[x]);
    const ta = pickOne(cands.length ? cands : a.ta);
    usedTa[ta] = 1;
    const pol = [];
    Object.keys(a.polWeight).forEach(k => { if (Math.random() < a.polWeight[k]) pol.push(k); });
    if (pol.includes('vbp') && !pol.includes('nrdl') && Math.random() < 0.6) pol.push('nrdl');
    PRODUCTS.push({
      id: a.id, name: names[i].name, short: names[i].name.slice(0, 2),
      kind: a.kind, driver: a.driver, base: a.base, awWeight: a.awWeight,
      priceEdge: a.priceEdge, color: a.color, 医保: a.医保, price: a.price, note: a.note,
      ta, pol,
    });
  });
  // 归一化品种结构
  Object.keys(MIX).forEach(tp => {
    const sum = PROD_ARCH.reduce((s, a) => s + (a.mix[tp] || 0), 0);
    PROD_ARCH.forEach(a => { MIX[tp][a.id] = (a.mix[tp] || 0) / sum; });
  });
}

function fill(str) {
  return String(str)
    .replace('{county}', WORLD.county)
    .replace('{county2}', WORLD.county2)
    .replace('{city}', WORLD.city)

    .replace('{c5}', WORLD.cities[4]).replace('{c6}', WORLD.cities[5]);
}

function buildTaAff(type) {
  const aff = {};
  TA_LIST.forEach(t => { aff[t.id] = 0.55 + Math.random() * 0.2; });
  const strong = {
    hospital: ['C', 'A', 'N', 'L'],
    primary: ['R', 'A', 'J', 'C'],
    retail: ['C', 'A', 'R', 'G'],
    city: ['C', 'A', 'N', 'L'],
    region: ['C', 'A', 'N', 'L'],
  }[type] || ['C', 'A'];
  strong.sort(() => Math.random() - 0.5).slice(0, 2).forEach(k => { aff[k] = 1.15 + Math.random() * 0.2; });
  return aff;
}

function tidFrom(tpl) {
  let h = 2166136261;
  for (let i = 0; i < tpl.length; i++) { h ^= tpl.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return 'h' + h.toString(36);
}

function buildTerminals() {
  TERM_SPECS.forEach((specs, act) => {
    TERMINALS[act].length = 0;
    specs.forEach((s, i) => {
      const stores = s[2] === 28 ? rndInt(14, 24)
        : s[2] === 43 ? rndInt(80, 160)
          : s[2] === 180 ? rndInt(260, 380) : 0;
      let name = fill(s[0]);
      name = name.replace('{stores}', stores)
        .replace('{stores2}', stores).replace('{stores3}', rndInt(36, 58))
        .replace('{stores4}', stores);
      TERMINALS[act].push({
        id: tidFrom(s[0] + '|' + s[1]),
        name, type: s[1], potential: s[2], access: s[3],
        awareness: s[4], relation: s[5], comp: s[6], tier: s[7],
        pharm: s[8] || 0, stores: s[9] ? stores : 0,
        ally: null, spend: 0, idle: 0,
        prof: pickOne(['academic', 'relation', 'price']),
        taAff: buildTaAff(s[1]),
        phtNext: 0,
      });
    });
    ALLIANCES[act].length = 0;
    (ALLY_SPECS[act] || []).forEach(a => {
      const members = a.members.map(i => TERMINALS[act][i].id);
      ALLIANCES[act].push({ id: a.id, name: fill(a.name), lead: TERMINALS[act][a.lead].id, members });
      members.forEach(mid => { TERMINALS[act].find(t => t.id === mid).ally = a.id; });
    });
  });
}

<script>
/* =========================================================
   engine.js — 游戏状态与结算逻辑（周回合制）
   ========================================================= */

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => (arr && arr.length ? arr[Math.floor(Math.random() * arr.length)] : null);
const uid = (() => { let n = 0; return () => 'r' + (++n); })();

let S = null;

/* ---------- 基础查询 ---------- */
function termById(id) { return S.terminals.find(t => t.id === id) || null; }
function tacticOf(r) { return TACTICS.find(x => x.id === r.tactic) || TACTICS[0]; }
function moraleOf(r) { return 0.55 + clamp(r.loyalty, 0, 100) / 100 * 0.55; }
function assignIds(r) { return Object.keys(r.assign || {}); }
function covers(r, tid) { return !!(r.assign && r.assign[tid]); }
function playerMod() { return (S && S.player && S.player.mod) || {}; }

/* ---------- 关系 ---------- */
function relOf(group, id) { return (S.rel && S.rel[group] && S.rel[group][id] != null) ? S.rel[group][id] : 50; }
function relMod(group, id) { return (relOf(group, id) - 50) / 50; }
function relAdd(group, id, d) {
  if (!S.rel || !S.rel[group] || S.rel[group][id] == null) return;
  S.rel[group][id] = clamp(S.rel[group][id] + d, 0, 100);
  if (S.relTouch) S.relTouch[group + ':' + id] = S.totalWeek;
}
function relTouched(group, id) { return (S.relTouch && S.relTouch[group + ':' + id]) || 0; }
function diffCfg() { return DIFFICULTY[S.diff] || DIFFICULTY.normal; }

/* ---------- 政策身份 ---------- */
function policyOf(p, type) {
  let mul = 1, access = 1, price = 0;
  (p.pol || []).forEach(k => {
    const d = POLICIES[k];
    if (!d) return;
    let m = d.mul;
    if (k === 'edl' && (type === 'primary' || type === 'retail')) m = d.primary;
    mul *= m; access *= d.access; price += d.price;
  });
  if (!(p.pol || []).length && (type === 'primary' || type === 'retail')) mul *= 0.88;
  return { mul, access, price };
}

function taOf(t, p) { return (t.taAff && t.taAff[p.ta]) || 0.7; }

const STRAT = {
  academic: { aw: 1.15, price: -0.015, access: 1.00 },
  price:    { aw: 0.85, price: 0.040, access: 1.00 },
  channel:  { aw: 0.90, price: 0.000, access: 1.08 },
};

function productShare(pid) {
  const st = computeStats();
  let num = 0, den = 0;
  S.terminals.forEach(t => { num += st.terms[t.id].items[pid].sales; den += t.potential * ((MIX[t.type] || MIX.hospital)[pid] || 0.25); });
  return den > 0 ? num / den : 0;
}

function outputOf(rep) {
  const st = computeStats();
  let out = 0;
  S.terminals.forEach(t => {
    const c = st.terms[t.id];
    const sum = c.reps.reduce((a, x) => a + x.pw, 0) || 1;
    c.reps.forEach(x => { if (x.id === rep.id) out += c.total * (x.pw / sum); });
  });
  return out;
}

/* ---------- 市场部 ---------- */
function marketTask() {
  const pool = MARKET_TASKS.filter(x => (x.minLevel || 0) <= S.level)
    .slice().sort((a, b) => (b.minLevel || 0) - (a.minLevel || 0));
  const t = pool[S.market.idx % pool.length];
  if (!t) return null;
  let cur = 0;
  if (t.metric === 'case') cur = S.market.cnt.case || 0;
  else if (t.metric === 'edu') cur = S.market.cnt.edu || 0;
  else if (t.metric === 'econ') cur = (S.market.cnt.city || 0) + (S.market.cnt.case || 0);
  else if (t.metric === 'kolrel') cur = relOf('external', 'kol') >= 65 ? 1 : 0;
  else if (t.metric === 'brand') cur = PRODUCTS.filter(p => (p.resWeeks || 0) > 0 || productShare(p.id) >= 0.2).length;
  else if (t.metric === 'covered') cur = new Set(S.team.flatMap(r => Object.keys(r.assign))).size;
  else if (t.metric === 'share') cur = Math.max(...PRODUCTS.map(p => productShare(p.id))) >= 0.22 ? 1 : 0;
  return { task: t, cur, need: t.need, done: cur >= t.need };
}

function grantRes(pid) {
  const p = PRODUCTS.find(x => x.id === pid);
  if (!p) return { ok: false, msg: '品种不存在' };
  if (relOf('internal', 'marketing') < 35) return { ok: false, msg: '市场部对你还没那么熟（好感 < 35）' };
  const c = +(4 * CFG.costScale[S.level]).toFixed(2);
  if (S.cash < c) return { ok: false, msg: '预算不足' };
  S.cash = +(S.cash - c).toFixed(2);
  p.resWeeks = 8;
  relAdd('internal', 'marketing', -8);
  log('good', `市场部批了 ${p.name} 的学术资源包，未来 8 周认知推进 +30%。`);
  return { ok: true, msg: `已申请 ${p.name} 学术资源` };
}

/* ---------- 建人 ---------- */
function pickVisible(n, forceId) {
  const out = [];
  if (forceId) {
    const t = VISIBLE_TAGS.find(x => x.id === forceId);
    if (t) out.push(t);
  }
  while (out.length < n) {
    const pool = VISIBLE_TAGS.filter(x => !out.includes(x));
    if (!pool.length) break;
    out.push(weightedPick(pool));
  }
  return out;
}

function makeRep(state, opt) {
  opt = opt || {};
  const visN = opt.traitId ? 2 : (Math.random() < 0.62 ? 2 : 1);
  const vis = pickVisible(visN, opt.traitId);
  const primary = vis[0];

  const hidN = 1 + (Math.random() < 0.55 ? 1 : 0) + (Math.random() < 0.18 ? 1 : 0);
  const hid = [];
  for (let i = 0; i < hidN; i++) {
    const pool = HIDDEN_TAGS.filter(x => !hid.includes(x));
    if (!pool.length) break;
    hid.push(weightedPick(pool));
  }

  const mod = {
    cap: 0, cov: 0, aw: 0, rel: 0, ct: 0, growth: 0, salary: 0,
    exposure: 0, fail: 0, ally: 0, loyalty0: 0, loyalty: 0, rebate: 0, jobhunt: 0,
  };
  vis.concat(hid).forEach(t => {
    Object.keys(t.eff || {}).forEach(k => { mod[k] = (mod[k] || 0) + t.eff[k]; });
  });

  const ability = opt.ability != null ? opt.ability
    : clamp(rnd(primary.ability[0], primary.ability[1]) + (opt.abilityBoost || 0), 20, 95);

  let name, guard = 0;
  do {
    name = pick(NAMES_SURNAME) + pick(NAMES_GIVEN);
    guard++;
  } while (state && state.team.some(r => r.name === name) && guard < 40);

  const role = opt.role || (Math.random() < 0.12 ? '学术专员' : '代表');
  const baseSalary = ROLES[role].salary * CFG.salaryScale[state ? state.level : 0];
  const salary = +(baseSalary * (0.85 + ability / 200) * (1 + mod.salary) * (opt.salaryBoost || 1)).toFixed(2);

  return {
    id: uid(), name, role,
    tags: vis.map(t => t.id),
    hidden: hid.map(t => t.id),
    revealed: [],
    guesses: [],
    mod,
    ability: +ability.toFixed(1),
    loyalty: +clamp(rnd(primary.loyalty[0], primary.loyalty[1]) + mod.loyalty0, 10, 100).toFixed(1),
    ct: +clamp(rnd(primary.ct[0], primary.ct[1]) + mod.ct, 0, 100).toFixed(1),
    exposure: 0,
    salary,
    filed: !!(opt && opt.filed),
    coach: 0,
    wPref: {},
    assign: {},
    tactic: 'standard',
    months: 0,
    lastWeek: { sales: 0, expo: 0 },
  };
}

function weightedPick(arr) {
  const total = arr.reduce((a, b) => a + (b.weight || 1), 0);
  let r = Math.random() * total;
  for (const it of arr) { r -= (it.weight || 1); if (r <= 0) return it; }
  return arr[arr.length - 1];
}

/* ---------- 标签推断 ---------- */

  const m = {};
  (r.hidden || []).forEach(id => {
    const t = HIDDEN_TAGS.find(x => x.id === id);
    if (!t) return;
    Object.keys(t.eff || {}).forEach(k => { m[k] = (m[k] || 0) + t.eff[k]; });

}

function unknownCount(r) {
  return Math.max(0, (r.hidden || []).length - (r.revealed || []).length);
}

function guessTag(rid, tagId) {
  const r = S.team.find(x => x.id === rid);
  if (!r) return { ok: false, msg: '没有这个人' };
  r.guesses = r.guesses || [];
  if (r.guesses.length >= 2) return { ok: false, msg: '每个人最多猜 2 次' };
  if (r.guesses.some(g => g.tag === tagId)) return { ok: false, msg: '这个已经猜过了' };
  if ((r.revealed || []).includes(tagId)) return { ok: false, msg: '已经确认过' };
  if (S.ap < 1) return { ok: false, msg: '精力不足，猜人也要花时间' };

  const t = HIDDEN_TAGS.find(x => x.id === tagId);
  if (!t) return { ok: false, msg: '标签不存在' };

  S.ap -= 1;
  const hit = (r.hidden || []).includes(tagId);
  r.guesses.push({ tag: tagId, ok: hit });

  if (hit) {
    r.revealed = (r.revealed || []).concat(tagId);
    r.mod.cap += 0.25;
    r.mod.cov += 0.05;
    r.mod.aw += 0.05;
    log('good', `【带人】你看准了 ${r.name} 是「${t.name}」。管理当量上限 +0.25，覆盖 +5%。`);
    return { ok: true, hit: true, tag: t, msg: `猜中了，他确实是「${t.name}」` };
  }

  r.mod.cov -= 0.06;
  r.loyalty = clamp(r.loyalty - 7, 0, 100);
  log('bad', `【带人】你把 ${r.name} 当成「${t.name}」，判断错了。忠诚 -7，覆盖 -6%。`);
  return { ok: true, hit: false, tag: t, msg: `猜错了，他不是「${t.name}」` };
}

/* ---------- 分配 ---------- */
function setAssign(rid, tid, on) {
  const r = S.team.find(x => x.id === rid);
  if (!r) return;
  if (on) PRODUCTS.forEach(p => setCellRep(tid, p.id, rid));
  else delete r.assign[tid];
}

function setCellRep(tid, pid, rid) {
  S.team.forEach(r => {
    const a = r.assign[tid];
    if (!a || r.id === rid) return;
    a.p = a.p.filter(x => x !== pid);
    if (!a.p.length && !a.pharm) delete r.assign[tid];
  });
  if (!rid) return;
  const r = S.team.find(x => x.id === rid);
  if (!r) return;
  if (!r.assign[tid]) r.assign[tid] = { p: [], pharm: false };
  if (!r.assign[tid].p.includes(pid)) r.assign[tid].p.push(pid);
}

function setPharmRep(tid, rid) {
  const t = termById(tid);
  if (!t || !t.pharm) return;
  S.team.forEach(r => {
    const a = r.assign[tid];
    if (!a) return;
    a.pharm = false;
    if (!a.p.length) delete r.assign[tid];
  });
  if (!rid) return;
  const r = S.team.find(x => x.id === rid);
  if (!r) return;
  if (!r.assign[tid]) r.assign[tid] = { p: [], pharm: false };
  r.assign[tid].pharm = true;
}

function trimAssignments(maxHosp) {
  let cut = 0;
  S.team.forEach(r => {
    const ids = assignIds(r).filter(id => { const t = termById(id); return t && t.type === 'hospital'; });
    if (ids.length <= maxHosp) return;
    ids.sort((a, b) => (termById(b).potential) - (termById(a).potential));
    ids.slice(maxHosp).forEach(id => { delete r.assign[id]; cut++; });
  });
  return cut;
}

/* ---------- 负荷与功率 ---------- */
function repCapOf(r) { return clamp(CFG.repCap + (r.mod ? r.mod.cap : 0), 0.8, 4); }

function repLoad(r) {
  let L = 0;
  assignIds(r).forEach(tid => {
    const t = termById(tid); if (!t) return;
    const a = r.assign[tid];
    L += (TYPE_COST[t.type] || 1) + 0.08 * Math.max(0, a.p.length - 1) + (a.pharm ? 0.12 : 0);
  });
  (ALLIANCES[S.level] || []).forEach(al => {
    const n = al.members.filter(m => covers(r, m)).length;
    if (n >= 2) L += 0.2 * (n - 1);
  });
  return L;
}

function repBase(r) {
  const pm = playerMod();
  const fileF = r.filed === false ? 0.55 : 1;
  const coachF = (r.coach || 0) > 0 ? 1.25 : 1;
  return (r.ability / 100) * ROLES[r.role].cov * moraleOf(r) * tacticOf(r).cov
    * (1 + (r.mod ? r.mod.cov : 0)) * (1 + (pm.cov || 0)) * fileF * coachF;
}

function tacticMulOf(r) {
  const t = tacticOf(r);
  return t.mul * (t.id === 'rebate' ? (1 + (r.mod ? r.mod.rebate : 0)) : 1);
}

function allyMulOf(t) {
  if (!t.ally) return 1;
  const al = (ALLIANCES[S.level] || []).find(a => a.id === t.ally);
  if (!al) return 1;
  let best = 1;
  S.team.forEach(r => {
    if (!covers(r, t.id)) return;
    const n = al.members.filter(m => covers(r, m)).length;
    if (n >= 2) best = Math.max(best, 1 + 0.06 * (n - 1) + (r.mod ? r.mod.ally : 0));
  });
  return Math.min(1.2, best);
}

function allianceOf(t) {
  if (!t.ally) return null;
  return (ALLIANCES[S.level] || []).find(a => a.id === t.ally) || null;
}

/* ---------- 全量统计 ---------- */
function computeStats() {
  const st = { terms: {}, total: 0, byProduct: {}, pharmTaken: 0, retailEff: 1, retailId: null };
  PRODUCTS.forEach(p => { st.byProduct[p.id] = 0; });

  const retail = S.terminals.find(t => t.type === 'retail');
  let pharmTaken = 0;
  S.terminals.forEach(t => {
    if (t.pharm > 0 && S.team.some(r => covers(r, t.id) && r.assign[t.id].pharm)) pharmTaken += t.pharm;
  });
  st.pharmTaken = pharmTaken;
  if (retail) {
    st.retailId = retail.id;
    st.retailEff = Math.min(1.8, Math.max(1, retail.stores / Math.max(retail.stores * 0.4, retail.stores - pharmTaken)));
  }
  const retailEff = st.retailEff;
  const orderMul = S.orderMul || 1;

  const info = S.team.map(r => {
    const L = repLoad(r);
    const base = repBase(r);
    const cap = repCapOf(r);
    const overload = L > cap ? Math.pow(cap / L, 0.6) : 1;
    return { r, L, base, overload, mul: tacticMulOf(r) };
  });

  S.terminals.forEach(t => {
    const cov = {};
    PRODUCTS.forEach(p => { cov[p.id] = 0; });
    let covAll = 0, mulW = 0, mulS = 0;
    const reps = [];
    info.forEach(({ r, L, base, overload, mul }) => {
      const a = r.assign[t.id];
      if (!a) return;
      const w = TYPE_COST[t.type] || 1;
      let pw = base * (w / Math.max(L, 0.001)) * overload;
      if (t.type === 'retail') pw *= retailEff;
      (a.p || []).forEach(pid => {
        const pref = (r.wPref && r.wPref[pid]) || 0;
        const wm = pref <= -0.5 ? 0 : 1 + pref;
        cov[pid] = (cov[pid] || 0) + pw * wm;
      });
      covAll += pw;
      mulW += pw; mulS += pw * mul;
      reps.push({ id: r.id, name: r.name, pw, p: a.p.slice(), pharm: a.pharm });
    });

    const tmul = mulW > 0 ? mulS / mulW : 1;
    const am = allyMulOf(t);
    const mix = MIX[t.type] || MIX.hospital;
    const items = {};
    let total = 0;

    const wAvg = PRODUCTS.reduce((a, x) => a + (x.w == null ? 50 : x.w), 0) / PRODUCTS.length || 50;
    PRODUCTS.forEach(p => {
      const m = mix[p.id] != null ? mix[p.id] : 0.25;
      const pol = policyOf(p, t.type);
      const taF = taOf(t, p);
      const stg = STRAT[p.strat || 'academic'];
      const resF = (p.resWeeks || 0) > 0 ? 1.3 : 1;
      const wF = clamp((p.w == null ? 50 : p.w) / wAvg, 0.35, 2.4);
      const avail = 0.02 + 0.98 * Math.pow(clamp(t.access * taF * stg.access, 0, 100) / 100, 0.7) * pol.access;
      let share = p.base
        + t.awareness / 100 * 0.26 * p.awWeight * stg.aw * resF
        + Math.min((cov[p.id] || 0) * wF, 1.7) * 0.115
        + t.relation / 100 * 0.11
        - t.comp * 0.16
        + p.priceEdge + pol.price + stg.price;
      share = clamp(share, 0, 0.75) * avail * tmul * am * orderMul * pol.mul
        * (t.stockBoost > 0 ? 2.0 : 1)
        * (t.stockBoost === 0 && t.stockDrop > 0 ? (t.stockMul || 0.8) : 1)
        * (1 - (p.neglect || 0)) * (distOver() > 0 ? 0.95 : 1);
      const sales = t.potential * m * share;
      items[p.id] = { share, sales, cov: cov[p.id] || 0, ta: taF, pol };
      total += sales;
      st.byProduct[p.id] += sales;
    });

    st.terms[t.id] = { cov, covAll, total, items, reps, am, tmul };
    st.total += total;
  });
  return st;
}

function calcTerminal(t) { return computeStats().terms[t.id]; }
function totalSales() { return S.terminals.reduce((a, t) => a + computeStats().terms[t.id].total, 0); }
function marketSize() { return S.terminals.reduce((a, t) => a + t.potential, 0); }

function distCap() { return 40 + relOf('external', 'distributor') * 0.9; }
function distOver() { return Math.max(0, S.dist.stock - distCap()); }

function relocateStock() {
  const c = +(1 * CFG.costScale[S.level]).toFixed(2);
  if (S.cash < c) return { ok: false, msg: '预算不足' };
  if (S.dist.stock < 5) return { ok: false, msg: '商业公司没多少库存可调' };
  S.cash = +(S.cash - c).toFixed(2);
  const moved = S.dist.stock * 0.4;
  S.dist.stock = +(S.dist.stock - moved).toFixed(1);
  relAdd('external', 'distributor', 2);
  log('good', `协调商业公司跨区调货 ${moved.toFixed(1)} 万，库存压力缓解。`);
  return { ok: true, msg: `调走 ${moved.toFixed(1)} 万库存` };
}

function teamRisk() {
  if (!S.team.length) return clamp(S.riskMod, 0, 100);
  const avg = S.team.reduce((a, r) => a + r.exposure, 0) / S.team.length;
  return clamp(avg + S.riskMod, 0, 100);
}

function salaryTotal() { return S.team.reduce((a, r) => a + r.salary, 0); }

function recentAvg(n) {
  const h = S.history.slice(-n);
  if (!h.length) return 0;
  return h.reduce((a, x) => a + x.sales, 0) / h.length;
}

function apMax() {
  const pm = playerMod();
  let base = CFG.apBase + Math.floor(S.team.length * CFG.apPerRep);
  if (S.team.length >= 10) base += 1;
  if (S.team.length >= 17) base += 1;
  return Math.min(CFG.apCap, base) + (pm.ap || 0);
}

/* ---------- 新游戏 ---------- */
function newGame(playerName, pathId, tagIds, diffId) {
  generateWorld();
  const dc = DIFFICULTY[diffId] || DIFFICULTY.normal;
  const pm = { ap: 0, cov: 0, growth: 0, fail: 0, dev: 0, compliance: 0, cost: 0, eval: 0, exposure: 0 };
  (tagIds || []).forEach(id => {
    const t = PLAYER_TAGS.find(x => x.id === id);
    if (!t) return;
    Object.keys(t.eff).forEach(k => { pm[k] = (pm[k] || 0) + t.eff[k]; });
  });

  S = {
    playerName: playerName || '王磊',
    path: pathId || 'sales',
    diff: diffId || 'normal',
    player: { path: pathId || 'sales', tags: (tagIds || []).slice(), mod: pm },
    rel: {
      internal: { boss: dc.boss, compliance: dc.relBase + 5, finance: dc.relBase, marketing: dc.relBase, medical: dc.relBase, commercial: dc.relBase, hr: dc.relBase },
      external: { hospital: dc.relBase, distributor: dc.relBase, kol: dc.relBase, association: dc.relBase },
    },
    relTouch: {},
    level: 0,
    weekInMonth: 1,
    monthInAct: 1,
    totalWeek: 1,
    totalMonth: 1,
    year: 2026,
    cash: dc.cash,
    ap: 0,
    compliance: 92,
    reputation: 55,
    riskMod: 0,
    team: [],
    terminals: [],
    candidates: [],
    pending: [],
    pendingEvents: [],
    market: { idx: 0, cnt: { case: 0, edu: 0, city: 0 }, since: 1 },
    dist: { stock: 0 },
    offer: null,
    log: [],
    history: [],
    flags: {},
    over: null,
    lastReport: null,
    wk: { sales: 0, gross: 0, salary: 0, resolved: [], incident: null },
    lastMonth: { cash: CFG.startCash, compliance: 92, reputation: 55 },
    weekLog: [],
    order: null,
    orderMul: 1,
    actExtended: false,
    planThisMonth: [],
    lastPlan: [],
    pendingPromotion: null,
  };
  enterAct(0, false);
  const a = makeRep(S, { traitId: 'grinder', ability: 58, role: '代表', filed: true });
  const b = makeRep(S, { traitId: 'scholar', ability: 55, role: '代表', filed: true });
  a.loyalty = clamp(a.loyalty + dc.loyalty, 0, 100);
  b.loyalty = clamp(b.loyalty + dc.loyalty, 0, 100);
  const t0 = S.terminals[0], t1 = S.terminals[1];
  a.assign[t0.id] = { p: PRODUCTS.map(p => p.id), pharm: true };
  b.assign[t1.id] = { p: PRODUCTS.slice(0, 2).map(p => p.id), pharm: false };
  S.team.push(a, b);
  // 个人标签带来的初始关系
  if (pm.relExt) {
    relAdd('external', 'hospital', pm.relExt * 1.2);
    relAdd('external', 'distributor', pm.relExt * 0.8);
    relAdd('external', 'kol', pm.relExt * 0.6);
    relAdd('external', 'association', pm.relExt * 0.4);
  }
  if (pm.relInt) ['boss', 'compliance', 'finance', 'marketing', 'medical', 'commercial', 'hr'].forEach(k => relAdd('internal', k, pm.relInt));
  if (pm.boss) relAdd('internal', 'boss', pm.boss);
  // 初始维护时间基线
  ['internal', 'external'].forEach(g => Object.keys(S.rel[g]).forEach(k => { S.relTouch[g + ':' + k] = S.totalWeek; }));

  S.ap = apMax();
  log('info', `你接手了${WORLD.county}市场。两个代表，两张桌子，100 万预算。`);
  log('sys', '提示：先看「终端」，把代表放到能出量的地方；准入低于 25 的终端几乎不出量。');
  return S;
}

function enterAct(level, carry) {
  const act = ACTS[level];
  if (carry) (S.career = S.career || []).push({ level: S.level, history: S.history });
  S.level = level;
  S.monthInAct = 1;
  S.weekInMonth = 1;
  S.actExtended = false;
  S.history = [];

  const prev = {};
  if (carry) S.terminals.forEach(t => { prev[t.id] = t; });

  S.terminals = TERMINALS[level].map(def => {
    const t = Object.assign({}, def);
    const p = prev[t.id];
    if (p) {
      t.access = p.access; t.awareness = p.awareness; t.relation = p.relation;
      t.comp = p.comp; t.spend = p.spend || 0; t.idle = p.idle || 0;
    } else {
      const dc0 = diffCfg();
      t.access = clamp(t.access + dc0.access, 0, 100);
      t.awareness = clamp(t.awareness + dc0.awareness, 0, 100);
      t.comp = clamp(t.comp + dc0.comp, 0, 0.95);
    }
    return t;
  });

  S.team.forEach(r => {
    const baseSalary = ROLES[r.role].salary * CFG.salaryScale[level];
    r.salary = +(baseSalary * (0.85 + r.ability / 200) * (1 + r.mod.salary)).toFixed(2);
    assignIds(r).forEach(tid => { if (!S.terminals.some(x => x.id === tid)) delete r.assign[tid]; });
  });
  S.pending = [];
  S.terminals.forEach(t => {
    t.phtOpen = 0;
    t.phtNext = 3 + Math.floor(Math.random() * 12);
  });
  S.ap = apMax();
}
